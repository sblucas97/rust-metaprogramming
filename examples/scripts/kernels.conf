# Per-kernel benchmark configuration, sourced by run_bench.sh / run_all.sh.
# This is the only place sizes live -- edit here, not in the runner.
#
# Everything else is convention rather than config:
#   CUDA source     src/benchmarks/cuda/<kernel>.cu
#   DSL invocation  demo <kernel> <n>          (impl label "rust-gpu")
#   CPU invocation  demo <kernel>_cpu <n>      (impl label "rust")
#
# Sizes were picked for this machine: 16 cores, ~11 GB usable RAM, RTX 3070 8 GB.

KERNELS=(vector_sum mm julia raytracer ripple nbodies nearest_neighbor)

# Sizes used when every selected implementation runs on the GPU. These are the
# tiers the previous per-kernel scripts used; the vector_sum / ripple ones come
# from the capacity methodology in ../../BENCHMARK_GPU_CAPACITY.md.
declare -A GPU_SIZES=(
    [vector_sum]="551121715 468453457 398185439"
    [mm]="5000 7000 9000"
    [julia]="7168 9216 11264"
    [raytracer]="7168 9216 11264"
    [ripple]="20330 17280 14688"
    [nbodies]="100000 200000 400000"
    [nearest_neighbor]="100000000 200000000 300000000"
)

# Sizes used when "rust" (pure CPU / rayon) is among the selected impls. The
# runner applies these to *every* impl in that run, because analyze_runs.py only
# emits a comparison row when both impls ran the same size.
#
# They step down from GPU_SIZES wherever the CPU cost class is worse than the
# GPU's: mm is naive O(N^3) and nbodies is O(N^2) x STEPS, so those drop hard.
# vector_sum / ripple / nearest_neighbor are bounded by host RAM instead
# (vector_sum holds 3 x N x 4 B, ripple holds dim^2 x 16 B).
declare -A CPU_SIZES=(
    [vector_sum]="100000000 200000000 398185439"
    [mm]="1024 2048 5000"
    [julia]="2048 4096 7168"
    [raytracer]="2048 4096 7168"
    [ripple]="4096 8192 14688"
    [nbodies]="10000 20000 40000"
    [nearest_neighbor]="100000000 200000000 300000000"
)

# Optional per-kernel default repetition count, overriding DEFAULT_RUNS below.
# mm is minutes per run on the CPU at its top size, so it gets fewer.
declare -A RUNS_DEFAULT=(
    [mm]=10
)

DEFAULT_RUNS=30

# Compute capability for nvcc; override with NVCC_ARCH=sm_XX or --arch.
NVCC_ARCH="${NVCC_ARCH:-sm_86}"
